</head>
<body>
       <header>
              <nav>
                     <h1 class="title">AutoBayPh</h1>
                     <ul>

                            -->
                     </ul>
              </nav>
              <div class="banner">
                     <div class="slide-wrapper">
                            <div class="slider">
                                   <img src = "IMAGES/AUTOBAYPH BANNER.png" alt="AutoBayPh Banner">
                                   <img src = "IMAGES/BYD BANNER.png" alt="BYD Banner">
                                   <img src = "IMAGES/GEELY BANNER.png" alt="GEELY Banner">
                                   <img src = "IMAGES/LETS GO PLACES.png" alt="LET'S GO PLACES Banner">
                                   <img src = "IMAGES/MITSUBISHI BANNER.png" alt="MITSUBISHI Banner">
                                   <img src = "IMAGES/SUZUKI BANNER.png" alt="SUZUKI Banner">
                            </div>
                            <div class="dots">
                                   <span class="dot active" onclick="goToSlide(0)"></span>
                                   <span class="dot" onclick="goToSlide(1)"></span>
                                   <span class="dot" onclick="goToSlide(2)"></span>
                                   <span class="dot" onclick="goToSlide(3)"></span>
                                   <span class="dot" onclick="goToSlide(4)"></span>
                                   <span class="dot" onclick="goToSlide(5)"></span>
                            </div>
                     </div>
              </div>
       </header>

       <script>
              let currentSlide = 0;
              const slider = document.querySelector('.slider');
              const dots = document.querySelectorAll('.dot');
              const totalSlides = dots.length;

              function goToSlide(index) {
                     currentSlide = index;
                     slider.style.transform = `translateX(-${currentSlide * 100}%)`;
                     dots.forEach(dot => dot.classList.remove('active'));
                     dots[currentSlide].classList.add('active');
              }

              function nextSlide() {
                     currentSlide = (currentSlide + 1) % totalSlides;
                     goToSlide(currentSlide);
              }

              setInterval(nextSlide, 3000); // auto-slide every 3 seconds
       </script>
</body>
</html>
