                            -->
                     </ul>
              </nav>
              <div class="H_image-container">
                     <h1>Where your journey <br> begins.</h1>
                     <a href="ABOUTPAGE.html" class="learnmorebtn">Learn More</a>
              <img src = "IMAGES/HOMEPAGE_IMAGE.png" alt="HomePage Image" class="H_image">
              </div>
              <div class="banner">
                     <div class="slide-wrapper">
                            <div class="slider">
                                   <img src = "IMAGES/AUTOBAYPH BANNER.png" alt="AutoBayPh Banner">
                                   <img src = "IMAGES/BYD BANNER.png" alt="BYD Banner">
                                   <img src = "IMAGES/GEELY BANNER.png" alt="GEELY Banner">
                                   <img src = "IMAGES/LETS GO PLACES.png" alt="LET'S GO PLACES Banner">
                                   <img src = "IMAGES/MITSUBISHI BANNER.png" alt="MITSUBISHI Banner">
                                   <img src = "IMAGES/SUZUKI BANNER.png" alt="SUZUKI Banner">
                            </div>
                            <div class="dots">
                                   <span class="dot active" onclick="goToSlide(0)"></span>
                                   <span class="dot" onclick="goToSlide(1)"></span>
                                   <span class="dot" onclick="goToSlide(2)"></span>
                                   <span class="dot" onclick="goToSlide(3)"></span>
                                   <span class="dot" onclick="goToSlide(4)"></span>
                                   <span class="dot" onclick="goToSlide(5)"></span>
                            </div>
                     </div>
              </div>
              <div>
                     <marquee behavior="scroll" scrollamount = "50" width="100%" direction="right"><h1>Welcome to AutoBayPh</h1></marquee>
              </div> 
       </header>
       <Content>
              <h1 id="Category" class="Carousel_Title "><a href="BRANDPAGE.html">BRANDS</a></h1>
              <div class="carousel">
                     <div class="group">
                            <div class="card"><img src = "IMAGES/TOYOTA_LOGO.png" alt="TOYOTA Logo"></div>
                            <div class="card"><img src = "IMAGES/BYD_LOGO.png" alt="BYD Logo"></div>
                            <div class="card"><img src = "IMAGES/GEELY_LOGO.png" alt="GEELY Logo"></div>
                            <div class="card"><img src = "IMAGES/MITSUBISHI_LOGO.png" alt="MITSUBISHI Logo"></div>
                            <div class="card"><img src = "IMAGES/SUZUKI_LOGO.png" alt="SUZUKI Logo"></div>
                            <div class="card"><img src = "IMAGES/HONDA_LOGO.png" alt="HONDA Logo"></div>
                     </div>
                     <div aria-hidden class="group">
                            <div class="card"><img src = "IMAGES/TOYOTA_LOGO.png" alt="TOYOTA Logo"></div>
                            <div class="card"><img src = "IMAGES/BYD_LOGO.png" alt="BYD Logo"></div>
                            <div class="card"><img src = "IMAGES/GEELY_LOGO.png" alt="GEELY Logo"></div>
                            <div class="card"><img src = "IMAGES/MITSUBISHI_LOGO.png" alt="MITSUBISHI Logo"></div>
                            <div class="card"><img src = "IMAGES/SUZUKI_LOGO.png" alt="SUZUKI Logo"></div>
                            <div class="card"><img src = "IMAGES/HONDA_LOGO.png" alt="HONDA Logo"></div>
                     </div>
              </div>
       </Content>
       <script>
              let currentSlide = 0;
              const slider = document.querySelector('.slider');
              const dots = document.querySelectorAll('.dot');
              const totalSlides = dots.length;

              function goToSlide(index) {
                     currentSlide = index;
                     slider.style.transform = `translateX(-${currentSlide * 100}%)`;
                     dots.forEach(dot => dot.classList.remove('active'));
                     dots[currentSlide].classList.add('active');
              }

              function nextSlide() {
                     currentSlide = (currentSlide + 1) % totalSlides;
                     goToSlide(currentSlide);
              }

              setInterval(nextSlide, 3000); // auto-slide every 3 seconds
       </script>
</body>
</html>
